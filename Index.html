<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MM Designs</title>

    <meta http-equiv="refresh" content="3;url=https://markmcsweeny95.wixsite.com/mmdesigns-1">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
        }

        .loader {
            width: 32px;
            height: 32px;
            margin: 0 auto;
            border: 3px solid #e5e5e5;
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: #111111;
            text-decoration: underline;
        }

        .link:hover {
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="logo">MM Designs</div>

        <p class="message">
            Redirecting you to the portfolio...
        </p>

        <div class="loader"></div>

        <a
            class="link"
            href="https://markmcsweeny95.wixsite.com/mmdesigns-1"
        >
            Continue to portfolio
        </a>
    </main>

</body>
</html>
